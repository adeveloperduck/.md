<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ideas - nav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;1,14..32,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --dark: #111111;
    --grey: #c0c0c0;
  }

  [data-theme="dark"] {
    --bg: #111111;
    --dark: #f0f0f0;
    --grey: #555555;
  }

  html { background: var(--bg); transition: background 0.3s ease; }

  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-style: normal;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    animation: pageEnter 0.4s ease;
    transition: background 0.3s ease, opacity 0.4s ease;
  }
  @media (max-width: 768px) {
    body { padding: 1.5rem; }
  }
  @media (max-width: 480px) {
    body { padding: 1rem; }
  }

  .container {
    max-width: 600px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-size: clamp(2rem, 4vw, 3rem);
    color: var(--dark);
    margin-bottom: 3rem;
    font-weight: 400;
    letter-spacing: -0.025em;
  }

  .ideas-list {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    margin-bottom: 4rem;
  }
  @media (max-width: 768px) {
    .ideas-list { 
      gap: 1.2rem;
      margin-bottom: 3rem;
    }
  }

  .idea-link {
    font-size: clamp(1.25rem, 3vw, 2rem);
    color: var(--grey);
    text-decoration: none;
    transition: color 0.3s ease;
  }

  .idea-link:hover {
    color: var(--dark);
  }

  .back-button {
    font-size: 1rem;
    color: var(--grey);
    text-decoration: none;
    transition: color 0.3s ease;
  }

  .back-button:hover {
    color: var(--dark);
  }

  /* Theme toggle */
  .theme-toggle {
    position: fixed;
    top: 2rem;
    right: 2rem;
    background: none;
    border: none;
    cursor: pointer;
    z-index: 100;
    color: var(--grey);
    transition: color 0.3s ease;
    padding: 0.5rem;
  }
  .theme-toggle:hover { color: var(--dark); }
  .theme-toggle svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    display: block;
  }
  .theme-toggle .sun-icon { display: none; }
  [data-theme="dark"] .theme-toggle .sun-icon { display: block; }
  [data-theme="dark"] .theme-toggle .moon-icon { display: none; }

  @keyframes pageEnter {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  body.page-exit {
    opacity: 0 !important;
  }
</style>
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  })();
</script>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
  <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>

<div class="container">
  <h1>ideas</h1>
  
  <div class="ideas-list">
    <a href="https://adeveloperduck.github.io/idea-1/" class="idea-link" target="_blank" rel="noopener noreferrer">
      idea 1
    </a>
    
    <a href="https://adeveloperduck.github.io/idea-2/" class="idea-link" target="_blank" rel="noopener noreferrer">
      idea 2
    </a>
    
    <a href="https://adeveloperduck.github.io/idea-3/" class="idea-link" target="_blank" rel="noopener noreferrer">
      idea 3
    </a>
  </div>

  <a href="index.html" class="back-button">
    back to home
  </a>
</div>

<script>
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  document.querySelectorAll('a[href]').forEach(link => {
    const href = link.getAttribute('href');
    if (href && !href.startsWith('http') && !href.startsWith('mailto:') && link.target !== '_blank') {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        document.body.classList.add('page-exit');
        setTimeout(() => { window.location.href = href; }, 400);
      });
    }
  });
</script>

</body>
</html>
